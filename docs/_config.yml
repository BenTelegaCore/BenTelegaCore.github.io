remote_theme: https://github.com/BenTelegaCore/site/
plugins:
- jekyll-remote-theme # add this line to the plugins list if you already have one

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default" 
title                    : "BenTelega / Core"
title_separator          : "-+"
name                     : &name "Your Name"
description              : &description "Your Name's academic portfolio"   # Update this with a general description of your site, this is the default if not overridden by a page
url                      : https://BenTelegacore.github.io # The base hostname & protocol for your site e.g. "https://[your GitHub username].github.io",
                                                           # or if you already have some other page hosted on Github then use "https://[your GitHub username].github.io/[Your Repo Name]"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "BenTelegacore/BenTelegacore.github.io"